<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulačka spropitného</title>
    <style>
        :root {
            --primary: #2b6cb0;
            --primary-hover: #2c5282;
            --bg: #f7fafc;
            --card-bg: #ffffff;
            --text: #2d3748;
            --text-muted: #718096;
            --border: #e2e8f0;
            --accent-bg: #ebf8ff;
            --radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .calculator-card {
            background: var(--card-bg);
            width: 100%;
            max-width: 480px;
            border-radius: var(--radius);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            padding: 28px;
            border: 1px solid var(--border);
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 24px;
            color: var(--text);
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper span.unit {
            position: absolute;
            right: 16px;
            color: var(--text-muted);
            font-weight: 600;
        }

        input[type="number"] {
            width: 100%;
            padding: 12px 16px;
            font-size: 1.125rem;
            border: 2px solid var(--border);
            border-radius: 10px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            color: var(--text);
            background: #fff;
        }

        input[type="number"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(43, 108, 176, 0.15);
        }

        .tip-buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 10px;
        }

        .btn-tip {
            background: var(--bg);
            border: 2px solid var(--border);
            border-radius: 8px;
            padding: 10px 0;
            font-size: 1rem;
            font-weight: 600;
            color: var(--text);
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-tip:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .btn-tip.active {
            background: var(--primary);
            border-color: var(--primary);
            color: #fff;
        }

        .results {
            background: var(--accent-bg);
            border-radius: 12px;
            padding: 20px;
            margin-top: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .result-row.total {
            border-top: 1px solid rgba(43, 108, 176, 0.2);
            padding-top: 12px;
            margin-top: 4px;
        }

        .result-label {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .result-label span {
            display: block;
            font-size: 0.75rem;
            color: #a0
aec0;
        }

        .result-value {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--primary);
        }

        .result-row.total .result-value {
            font-size: 1.5rem;
            color: var(--primary-hover);
        }

        .btn-reset {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            background: #edf2f7;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
        }

        .btn-reset:hover {
            background: #e2e8f0;
            color: var(--text);
        }

        @media (max-width: 400px) {
            .tip-buttons {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>

<div class="calculator-card">
    <h1>Kalkulačka spropitného</h1>

    <div class="input-group">
        <label for="bill">Účet celkem</label>
        <div class="input-wrapper">
            <input type="number" id="bill" placeholder="0" min="0" step="any" inputmode="decimal">
            <span class="unit">Kč</span>
        </div>
    </div>

    <div class="input-group">
        <label>Spropitné</label>
        <div class="tip-buttons">
            <button type="button" class="btn-tip" data-tip="5">5 %</button>
            <button type="button" class="btn-tip active" data-tip="10">10 %</button>
            <button type="button" class="btn-tip" data-tip="15">15 %</button>
            <button type="button" class="btn-tip" data-tip="20">20 %</button>
        </div>
        <div class="input-wrapper">
            <input type="number" id="custom-tip" placeholder="Vlastní procento" min="0" step="any" inputmode="decimal">
            <span class="unit">%</span>
        </div>
    </div>

    <div class="input-group">
        <label for="people">Počet osob</label>
        <div class="input-wrapper">
            <input type="number" id="people" value="1" min="1" step="1" inputmode="numeric">
            <span class="unit">os.</span>
        </div>
    </div>

    <div class="results">
        <div class="result-row">
            <div class="result-label">Spropitné celkem</div>
            <div class="result-value" id="tip-amount">0 Kč</div>
        </div>
        <div class="result-row">
            <div class="result-label">Celková částka</div>
            <div class="result-value" id="total-amount">0 Kč</div>
        </div>
        <div class="result-row total">
            <div class="result-label">
                Na jednu osobu
                <span id="per-person-sub">při 1 osobě</span>
            </div>
            <div class="result-value" id="per-person-amount">0 Kč</div>
        </div>
    </div>

    <button type="button" class="btn-reset" id="reset-btn">Vynulovat</button>
</div>

<script>
    const billInput = document.getElementById('bill');
    const tipButtons = document.querySelectorAll('.btn-tip');
    const customTipInput = document.getElementById('custom-tip');
    const peopleInput = document.getElementById('people');

    const tipAmountDisplay = document.getElementById('tip-amount');
    const totalAmountDisplay = document.getElementById('total-amount');
    const perPersonAmountDisplay = document.getElementById('per-person-amount');
    const perPersonSub = document.getElementById('per-person-sub');
    const resetBtn = document.getElementById('reset-btn');

    let currentTipPercent = 10;

    function formatCurrency(amount) {
        return amount.toLocaleString('cs-CZ', {
            minimumFractionDigits: 0,
            maximumFractionDigits: 2
        }) + ' Kč';
    }

    function calculate() {
        const bill = parseFloat(billInput.value) || 0;
        const people = Math.max(1, parseInt(peopleInput.value) || 1);

        const tipTotal = bill * (currentTipPercent / 100);
        const grandTotal = bill + tipTotal;
        const perPerson = grandTotal / people;

        tipAmountDisplay.textContent = formatCurrency(tipTotal);
        totalAmountDisplay.textContent = formatCurrency(grandTotal);
        perPersonAmountDisplay.textContent = formatCurrency(perPerson);

        if (people === 1) {
            perPersonSub.textContent = 'při 1 osobě';
        } else if (people >= 2 && people <= 4) {
            perPersonSub.textContent = `při ${people} osobách`;
        } else {
            perPersonSub.textContent = `při ${people} osobách`;
        }
    }

    tipButtons.forEach(button => {
        button.addEventListener('click', () => {
            tipButtons.forEach(btn => btn.classList.remove('active'));
            button.classList.add('active');
            customTipInput.value = '';
            currentTipPercent = parseFloat(button.dataset.tip);
            calculate();
        });
    });

    customTipInput.addEventListener('input', () => {
        tipButtons.forEach(btn => btn.classList.remove('active'));
        const val = parseFloat(customTipInput.value);
        currentTipPercent = isNaN(val) ? 0 : val;
        calculate();
    });

    billInput.addEventListener('input', calculate);
    peopleInput.addEventListener('input', calculate);

    resetBtn.addEventListener('click', () => {
        billInput.value = '';
        customTipInput.value = '';
        peopleInput.value = '1';
        tipButtons.forEach(btn => btn.classList.remove('active'));
        tipButtons[1].classList.add('active'); // set 10% back as default
        currentTipPercent = 10;
        calculate();
    });

    // Initial calculation
    calculate();
</script>

</body>
</html>
