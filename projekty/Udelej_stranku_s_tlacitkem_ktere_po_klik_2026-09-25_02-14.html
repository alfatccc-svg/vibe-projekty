<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Změna barvy pozadí</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f0f4f8;
            /* Plynulý přechod při změně barvy */
            transition: background-color 0.5s ease;
            padding: 20px;
        }

        /* Karta pro ovládací prvky s efektem skla */
        .card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
            text-align: center;
            max-width: 400px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        h1 {
            font-size: 1.8rem;
            color: #1e293b;
            margin-bottom: 12px;
        }

        p {
            font-size: 1rem;
            color: #64748b;
            margin-bottom: 28px;
        }

        /* Zobrazení HEX kódu barvy */
        .color-code {
            font-weight: 700;
            font-family: monospace;
            background: #e2e8f0;
            padding: 4px 10px;
            border-radius: 8px;
            color: #0f172a;
            letter-spacing: 1px;
        }

        /* Tlačítko s hover efektem */
        button {
            background-color: #4f46e5;
            color: #ffffff;
            border: none;
            padding: 16px 32px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(79, 70, 229, 0.35);
            transition: all 0.2s ease;
            width: 100%;
        }

        button:hover {
            background-color: #4338ca;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(79, 70, 229, 0.45);
        }

        button:active {
            transform: translateY(0);
            box-shadow: 0 2px 8px rgba(79, 70, 229, 0.35);
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Změna barvy pozadí</h1>
        <p>Aktuální barva: <span id="colorCode" class="color-code">#F0F4F8</span></p>
        <button id="changeColorBtn">Změnit barvu</button>
    </div>

    <script>
        // Odkazy na HTML prvky
        const btn = document.getElementById('changeColorBtn');
        const colorCodeText = document.getElementById('colorCode');

        // Funkce pro vygenerování náhodné HEX barvy
        function getRandomHexColor() {
            const letters = '0123456789ABCDEF';
            let color = '#';
            for (let i = 0; i < 6; i++) {
                color += letters[Math.floor(Math.random() * 16)];
            }
            return color;
        }

        // Reakce na kliknutí na tlačítko
        btn.addEventListener('click', () => {
            const newColor = getRandomHexColor();
            // Aplikace nové barvy na pozadí stránky
            document.body.style.backgroundColor = newColor;
            // Aktualizace textu s kódem barvy
            colorCodeText.textContent = newColor;
        });
    </script>

</body>
</html>
