<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filtr funguje</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #f0fdf4 0%, #e0f2fe 100%);
            padding: 20px;
            color: #0f172a;
        }

        /* Hlavní karta */
        .card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 40px 32px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            border: 1px solid rgba(255, 255, 255, 0.8);
            text-align: center;
            max-width: 480px;
            width: 100%;
        }

        /* Ikona úspěchu */
        .icon-container {
            width: 80px;
            height: 80px;
            background-color: #dcfce7;
            color: #16a34a;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            box-shadow: 0 4px 12px rgba(22, 163, 74, 0.15);
        }

        .icon-container svg {
            width: 40px;
            height: 40px;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            color: #166534;
            margin-bottom: 12px;
        }

        p {
            color: #475569;
            font-size: 1rem;
            line-height: 1.5;
            margin-bottom: 28px;
        }

        /* Názorná ukázka funkčního filtru */
        .filter-demo {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 16px;
        }

        .filter-buttons {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: #ffffff;
            border: 1px solid #cbd5e1;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #334155;
        }

        .filter-btn:hover {
            border-color: #16a34a;
            color: #16a34a;
        }

        .filter-btn.active {
            background: #16a34a;
            color: white;
            border-color: #16a34a;
        }

        .items-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .item {
            background: white;
            padding: 12px 8px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            border: 1px solid #e2e8f0;
            transition: all 0.3s ease;
            color: #1e293b;
        }

        .item.hidden {
            display: none;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="icon-container">
            <!-- Ikona fajfky / úspěchu -->
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" />
            </svg>
        </div>

        <h1>Filtr funguje</h1>
        <p>Všechny systémy jsou aktivní a filtrování dat probíhá bez problémů.</p>

        <!-- Živá ukázka filtrování -->
        <div class="filter-demo">
            <div class="filter-buttons">
                <button class="filter-btn active" onclick="filterItems('all', this)">Vše</button>
                <button class="filter-btn" onclick="filterItems('ovoce', this)">Ovoce</button>
                <button class="filter-btn" onclick="filterItems('zelenina', this)">Zelenina</button>
            </div>
            <div class="items-grid">
                <div class="item" data-category="ovoce">🍎 Jablko</div>
                <div class="item" data-category="zelenina">🥦 Brokolice</div>
                <div class="item" data-category="ovoce">🍌 Banán</div>
                <div class="item" data-category="zelenina">🥕 Mrkev</div>
                <div class="item" data-category="ovoce">🍊 Pomeranč</div>
                <div class="item" data-category="zelenina">🍅 Rajče</div>
            </div>
        </div>
    </div>

    <script>
        // Funkce pro filtrování prvků
        function filterItems(category, btn) {
            // Aktualizace aktivního tlačítka
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            // Zobrazení / skrytí prvků podle kategorie
            const items = document.querySelectorAll('.item');
            items.forEach(item => {
                if (category === 'all' || item.dataset.category === category) {
                    item.classList.remove('hidden');
                } else {
                    item.classList.add('hidden');
                }
            });
        }
    </script>

</body>
</html>
